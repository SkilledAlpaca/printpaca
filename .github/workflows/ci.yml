name: ci
on:
  push:
    branches: [main]
    # Any v* tag; scripts/lib-tag.sh's is_stable_release_tag decides "stable".
    tags: ["v*"]
  pull_request:
  # Manual runs exercise the image build and size gate; the push is tag-gated.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: server/go.mod } # test the declared floor, not a floated patch
      - run: npm ci
      - run: npx vitest run
      - run: npm run check -w web
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build -w web
      # -race shares this step: it adds under a minute to a job dominated by npm ci,
      # vitest, and Playwright.
      - run: cd server && test -z "$(gofmt -l .)" && go vet ./... && go test ./... -race -count=1
      # Pinned, so bumping the gate is deliberate; runs without touching go.mod.
      - run: cd server && go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: npm audit --omit=dev --audit-level=high
      # Full tree (prod, dev, optional); a failure is a real finding.
      - run: npm audit --audit-level=high

  # Builds both architectures and runs the size gate on main, pull requests,
  # tags, and manual runs; only v* tags push (the gate lives in scripts/ci-build-image.sh).
  image:
    needs: test
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build, size-check, and push
        run: bash scripts/ci-build-image.sh
        env:
          IMAGE_REPO: skilledalpaca/printpaca
