name: Bug report
description: Something in printpaca doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security issue, don't open a public issue. Use [private vulnerability reporting](https://github.com/SkilledAlpaca/printpaca/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag (for example v1.0.0) or the version in the sidebar footer.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run printpaca
      options:
        - docker run
        - Docker Compose
        - Unraid
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker compose logs printpaca`, or Settings > Diagnostics > Export recent errors. Remove client names, emails, and passwords first.
      render: text
