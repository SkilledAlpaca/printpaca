name: ci
on:
  push:
    branches: [main]
    # Any v* tag; scripts/lib-tag.sh's is_stable_release_tag decides "stable".
    tags: ["v*"]
  pull_request:
  # Manual runs exercise the image build and size gate; the push is tag-gated.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum } # test the declared floor, not a floated patch
      - run: npm ci
      # Blocks raw spacing and width literals in migrated files; warns elsewhere (scripts/css-lint.config.json).
      - run: npm run lint:css
      - run: npx vitest run
      - run: npm run check -w web
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build -w web
      # -race shares this step: it adds under a minute to a job dominated by npm ci,
      # vitest, and Playwright.
      # Fails when a linked Go module's version differs from THIRD_PARTY_NOTICES.md.
      - run: bash scripts/check-notices.sh
      - run: cd server && test -z "$(gofmt -l .)" && go vet ./... && go test ./... -race -count=1
      # Pinned, so bumping the gate is deliberate; runs without touching go.mod.
      - run: cd server && go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: npm audit --omit=dev --audit-level=high
      # Full tree (prod, dev, optional); a failure is a real finding.
      - run: npm audit --audit-level=high

  # Builds both architectures and runs the size gate on main, pull requests,
  # tags, and manual runs; only v* tags push (the gate lives in scripts/ci-build-image.sh).
  image:
    needs: test
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build, size-check, and push
        run: bash scripts/ci-build-image.sh
        env:
          IMAGE_REPO: skilledalpaca/printpaca
